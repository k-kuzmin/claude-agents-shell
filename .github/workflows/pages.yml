name: pages

# Лендинг публикуется на GitHub Pages при изменении сайта или картинок макета.
# Картинки не дублируются в site/: берутся из docs/ при сборке.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/mockup*.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз; начатый не прерывается, чтобы не оставить сайт полусобранным.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Статика без сборки: страница как есть плюс макеты из docs/ в assets/.
      - name: Собрать _site
        run: |
          mkdir -p _site/assets
          cp -r site/. _site/
          cp docs/mockup*.svg _site/assets/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      <text x="292" y="232" fill="#D97757">●</text>
      <text x="310" y="232" fill="#E9E6E0">Edit(src/Core/Repositories/OrderRepository.cs)</text>
      <text x="310" y="252" fill="#8A857C">⎿ <tspan fill="#6FA8A0">+21</tspan> <tspan fill="#D97757">−2</tspan></text>

